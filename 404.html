<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <title>Redirecting...</title>
    <script>
      (function (location) {
        var pathSegmentsToKeep = 0;
        location.replace(
          location.protocol + '//' + location.hostname + (location.port ? ':' + location.port : '') +
          location.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?_p=' +
          location.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (location.search ? '&_q=' + location.search.slice(1).replace(/&/g, '~and~') : '') +
          location.hash
        );
      }(window.location));
    </script>
  </head>
  <body>
    <p>Redirecting to the requested page...</p>
  </body>
</html>
