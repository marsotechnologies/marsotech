  // Parse the redirect URL from the 404 page hack back into the Angular router
  (function(l) {
    if (l.search[1] === '_') {
      var decoded = {};
      l.search.slice(1).split('&').forEach(function(q) {
        var parts = q.split('=');
        decoded[parts[0]] = window.decodeURIComponent(parts[1].replace(/~and~/g, '&'));
      });
      if (decoded._p !== undefined) {
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + (decoded._p ? '/' + decoded._p : '') +
          (decoded._q ? '?' + decoded._q : '') +
          l.hash
        );
      }
    }
  }(window.location));
</script>
